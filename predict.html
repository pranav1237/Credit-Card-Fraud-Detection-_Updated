<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predict - Credit Card Fraud Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <nav class="bg-teal-600 text-white p-4">
      <div class="container mx-auto flex justify-between">
        <h1 class="text-xl font-bold">Fraud Detection Dashboard</h1>
        <div>
          <span>Welcome, {{ username }}!</span>
          <a href="{{ url_for('logout') }}" class="ml-4 hover:underline">Logout</a>
        </div>
      </div>
    </nav>
    <div class="container mx-auto p-4">
      <h2 class="text-2xl font-bold mb-4">Predict Fraud</h2>
      <div class="max-w-6xl bg-white p-6 rounded-lg shadow-md">
        <form id="predictForm">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2">Time</label>
              <input type="number" id="time" value="0" class="shadow appearance-none border rounded w-full py-2 px-3" step="0.01">
            </div>
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2">Amount</label>
              <input type="number" id="amount" value="100" class="shadow appearance-none border rounded w-full py-2 px-3" step="0.01">
            </div>
          </div>
          <div id="vInputs" class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-4">
            <!-- V1-V28 inputs will be generated by JS -->
          </div>
          <button type="submit" class="bg-teal-500 hover:bg-teal-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline">Predict</button>
        </form>
        <div id="result" class="mt-6 p-4 bg-gray-50 rounded hidden">
          <h3 class="text-lg font-bold mb-2">Prediction Result:</h3>
          <p id="prediction"></p>
          <p id="probability"></p>
          <div id="topFeatures" class="mt-4"></div>
        </div>
      </div>
      <div class="links mt-6">
        <a href="{{ url_for('index') }}" class="mr-4 text-teal-500">Dashboard</a>
        <a href="{{ url_for('data_page') }}" class="mr-4 text-teal-500">Data</a>
        <a href="{{ url_for('visualize') }}" class="text-teal-500">Visualize</a>
      </div>
    </div>
    <script>
      // Generate inputs for V1 to V28
      const vContainer = document.getElementById('vInputs');
      for (let i = 1; i <= 28; i++) {
        const div = document.createElement('div');
        div.innerHTML = `
          <label class="block text-gray-700 text-sm font-bold mb-2">V${i}</label>
          <input type="number" id="V${i}" value="0" class="shadow appearance-none border rounded w-full py-2 px-3" step="0.0001">
        `;
        vContainer.appendChild(div);
      }

      // Handle form submission
      document.getElementById('predictForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = { time: parseFloat(document.getElementById('time').value), amount: parseFloat(document.getElementById('amount').value) };
        for (let i = 1; i <= 28; i++) {
          formData[`V${i}`] = parseFloat(document.getElementById(`V${i}`).value);
        }

        try {
          const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const data = await response.json();

          // Redirect to visualize for prediction visualization
          window.location.href = '/visualize';
        } catch (error) {
          alert('Error making prediction: ' + error.message);
        }
      });
    </script>
  </body>
</html>
